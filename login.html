<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page </title>
</head>
<body>
<h2>Login to your account </h2>
<form action="/login-endpoint" method="POST">
<div>
<label for="login-mail"> Email or Username: </label>
<input type="email" id="login-email" name="username" placeholder="Enter your mail" required>
</div>
<br>
<div>
<label for="password">Password </label>
<input type="password" id="loginpass" name="pass" placeholder="Enter your password" required>
</div>
<br>
<button type="submit">Log In </button>
</form>
</body>
</html>
